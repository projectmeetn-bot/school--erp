{% extends 'base.html' %}

{% block title %}
Subjects
{% endblock %}

{% block content %}

<h2>Subjects</h2>

<a href="{% url 'subject_add' %}"
   class="btn btn-primary mb-3">
    Add Subject
</a>

<table class="table table-bordered">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Code</th>
        <th>Teacher</th>
        <th>Action</th>
    </tr>

    {% for subject in subjects %}

    <tr>

        <td>{{ subject.id }}</td>

        <td>{{ subject.name }}</td>

        <td>{{ subject.code }}</td>

        <td>{{ subject.teacher }}</td>

        <td>

            <a href="{% url 'subject_update' subject.id %}"
               class="btn btn-warning btn-sm">
                Edit
            </a>

            <a href="{% url 'subject_delete' subject.id %}"
               class="btn btn-danger btn-sm">
                Delete
            </a>

        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
