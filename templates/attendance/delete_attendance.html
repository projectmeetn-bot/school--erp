{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">
            <h4>Delete Attendance</h4>
        </div>

        <div class="card-body">

            <p>
                Are you sure you want to delete attendance for:
            </p>

            <ul>
                <li>
                    <strong>Class:</strong>
                    {{ attendance.classroom }}
                </li>

                <li>
                    <strong>Date:</strong>
                    {{ attendance.date }}
                </li>
            </ul>

            <form method="post">
                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'attendance_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
