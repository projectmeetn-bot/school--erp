{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

<h2>
Attendance :
{{ attendance.classroom }}
-
{{ attendance.date }}
</h2>

<table class="table table-bordered">

<tr>
    <th>Roll No</th>
    <th>Name</th>
    <th>Status</th>
</tr>

{% for detail in details %}

<tr>

<td>{{ detail.student.roll_no }}</td>

<td>{{ detail.student.name }}</td>

<td>{{ detail.status }}</td>

</tr>

{% endfor %}

</table>

<a href="{% url 'attendance_list' %}"
   class="btn btn-secondary">
   Back
</a>

</div>

{% endblock %}
