{% extends 'base.html' %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        Edit Timetable
                    </h4>
                </div>

                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Classroom
                                </label>
                                {{ form.classroom }}
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Subject
                                </label>
                                {{ form.subject }}
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Teacher
                                </label>
                                {{ form.teacher }}
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Day
                                </label>
                                {{ form.day }}
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Start Time
                                </label>
                                {{ form.start_time }}
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    End Time
                                </label>
                                {{ form.end_time }}
                            </div>

                        </div>

                        <hr>

                        <button
                            type="submit"
                            class="btn btn-success">
                            Save Changes
                        </button>

                        <a href="javascript:history.back()"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
