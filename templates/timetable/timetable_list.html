{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h3>Timetable Management</h3>
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <tr>
                    <th>Class</th>
                    <th>Action</th>
                </tr>

                {% for classroom in classrooms %}

                <tr>

                    <td>{{ classroom }}</td>

                    <td>

                        <a href="{% url 'generate_timetable' classroom.id %}"
                           class="btn btn-success btn-sm">
                            Generate
                        </a>

                        <a href="{% url 'class_timetable' classroom.id %}"
                           class="btn btn-info btn-sm">
                            View
                        </a>

                    </td>

                </tr>

                {% endfor %}

            </table>

        </div>

    </div>

</div>

{% endblock %}
