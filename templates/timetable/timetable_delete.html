{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

<div class="card">

<div class="card-header bg-danger text-white">
    Delete Timetable
</div>

<div class="card-body">

<p>
Are you sure you want to delete this timetable entry?
</p>

<ul>

    <li>
        <strong>Class:</strong>
        {{ timetable.classroom }}
    </li>

    <li>
        <strong>Subject:</strong>
        {{ timetable.subject }}
    </li>

    <li>
        <strong>Day:</strong>
        {{ timetable.day }}
    </li>

</ul>

<form method="post">

    {% csrf_token %}

    <button type="submit"
            class="btn btn-danger">
        Delete
    </button>

    <a href="javascript:history.back()"
       class="btn btn-secondary">
       Cancel
    </a>

</form>

</div>

</div>

</div>

{% endblock %}
